name: tareas_uniandes
description: "Tareas Uniandes - App de lista de tareas con fecha límite y prioridad. Autor: Bryan Puma."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.3
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/uniandes.png"
  adaptive_icon_background: "#003865"
  adaptive_icon_foreground: "assets/icon/uniandes.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/uniandes.png
